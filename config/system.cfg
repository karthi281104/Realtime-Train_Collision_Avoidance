[simulation]
dt = 0.05
prediction_horizon = 30.0
safety_margin_m = 50.0

[trains]
default_reaction_time = 1.5

[risk]
emergency_ttc_s  = 5.0
critical_ttc_s   = 10.0
warning_ttc_s    = 20.0
caution_ttc_s    = 30.0

[communication]
default_delay_ms  = 100.0
default_jitter_ms = 30.0
default_loss_rate = 0.02

[dashboard]
refresh_hz = 10

[logging]
log_dir = logs
level   = INFO
